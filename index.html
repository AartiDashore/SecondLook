<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction Review</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="phone">
    <header class="app-bar">
      <button class="icon-btn" id="backBtn" aria-label="Back">&#8249;</button>
    </header>

    <section class="content">
      <p class="eyebrow">BEFORE YOU SEND</p>
      <h1>Let’s take a closer look</h1>
      <p class="subtitle">A quick review can help protect your money.</p>

      <div class="card score-card">
        <h2>Confidence score</h2>
        <div class="gauge">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="track" cx="60" cy="60" r="52" />
            <circle class="progress" id="progress" cx="60" cy="60" r="52" />
          </svg>
          <div class="gauge-inner">
            <span class="score" id="score">0</span>
            <span class="out-of">out of 100</span>
          </div>
        </div>
        <span class="badge" id="badge">Review recommended</span>
        <p class="hint">Higher scores mean greater confidence.</p>
      </div>

      <h2 class="section-title">3 risk factors</h2>
      <p class="section-sub">Here’s what stood out about this transaction.</p>

      <ul class="risks" id="riskList">
      </ul>
    </section>

    <div class="buttons">
      <button class="btn primary" id="contactBtn">Contact a representative</button>
      <button class="btn secondary" id="thinkBtn">Take another look</button>
    </div>

    <footer class="actions">
      <button class="btn cancel" id="cancelBtn"><span class="arrow" aria-hidden="true">&larr;</span> Cancel</button>
      <button class="btn continue" id="continueBtn">Continue <span class="arrow" aria-hidden="true">&rarr;</span></button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
